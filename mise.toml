# The tools a checkout needs and the commands run against it, for laptops and
# CI alike. Every task is a thin wrapper, so plain cargo keeps working without
# mise. What mise cannot provide stays a system prerequisite: clang, libclang
# and fontconfig for the build, flatpak-builder for the flatpak, rsvg-convert
# and Xcode's command line tools for the macOS bundle.

[env]
# Where the viewer and the tests find the embedding model that searching by
# meaning uses, which `mise run model:fetch` downloads. An installed build
# looks under the platform's data directory instead.
MELKKIPDF_MODEL_DIR = "{{config_root}}/data/model"

[tools]
# Pinned rather than "latest", so CI and every laptop compile the same thing
# and a new stable cannot turn a branch red on its own. Bump it deliberately.
rust = { version = "1.99", components = ["rustfmt", "clippy"] }
# The macOS bundle and the release check read the version with it.
jq = "1.8"
# Runs the flatpak cargo generator with its two dependencies, in place of a
# hand-rolled virtualenv.
uv = "0.12"
shellcheck = "0.11"
# Lists the crates' licences for the third-party licences the packages ship.
"github:EmbarkStudios/cargo-about" = "0.9.2"

[tasks.build]
description = "Build the release binary"
run = "cargo build --release"

[tasks.run]
description = "Build and open a PDF"
usage = 'arg "<pdf>" help="The document to open"'
run = 'cargo run --release -- "${usage_pdf?}"'

[tasks.test]
description = "Run the tests, headlessly"
run = "cargo test --features testing"

[tasks."model:fetch"]
description = "Download the embedding model for searching by meaning"
run = "packaging/common/fetch-model.sh"

[tasks."test:model"]
description = "Run the tests that need the embedding model"
run = "cargo test --features testing -- --ignored the_real_model"

[tasks.fmt]
description = "Format the Rust sources"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Fail on unformatted Rust sources"
run = "cargo fmt --all --check"

[tasks.clippy]
description = "Lint the Rust sources, warnings as errors"
run = "cargo clippy --all-targets --features testing -- -D warnings"

[tasks."lint:shell"]
description = "Lint the packaging scripts"
run = "shellcheck packaging/*/*.sh"

[tasks.check]
description = "Everything CI checks"
depends = ["fmt:check", "clippy", "test", "lint:shell"]

[tasks.render]
description = "Render a page of a PDF to a PNG, without a window"
usage = '''
arg "<pdf>" help="The document to render"
arg "<png>" help="Where to write the page"
arg "[page]" help="The 0-based page" default="0"
'''
run = 'cargo run --example render_png -- "${usage_pdf?}" "${usage_png?}" "${usage_page?}"'

[tasks.licenses]
description = "Regenerate the third-party licences the packages ship"
run = "packaging/common/generate-licenses.sh"
# Skipped while the file is newer than what it is made from, and a dependency
# of every package, so none ships a stale list.
sources = [
    "Cargo.lock",
    "packaging/common/generate-licenses.sh",
    "packaging/common/licenses/**/*",
]
outputs = ["packaging/common/third-party-licenses.txt"]

[tasks."macos:app"]
description = "Build target/MelkkiPDF.app, signed for this machine only unless told otherwise"
depends = ["licenses"]
run = "packaging/macos/build-app.sh"

[tasks."macos:dmg"]
description = "Pack the app into target/MelkkiPDF-<version>.dmg, notarizing both when given a key"
depends = ["macos:app"]
run = "packaging/macos/dmg.sh"

[tasks."macos:check"]
description = "Check the app and the disk image, and Gatekeeper's verdict once they are signed"
run = "packaging/macos/check.sh"

[tasks."flatpak:sources"]
description = "Regenerate the vendored crate list from Cargo.lock"
run = "packaging/flatpak/generate-cargo-sources.sh"
# Skipped while the list is newer than the lock file, and a dependency of the
# build, so the flatpak can never be built from a stale list.
sources = ["Cargo.lock", "packaging/flatpak/generate-cargo-sources.sh"]
outputs = ["packaging/flatpak/cargo-sources.json"]

[tasks."flatpak:runtime"]
description = "Install the runtime and SDK the flatpak builds against"
run = """
flatpak remote-add --if-not-exists --user \
    flathub https://dl.flathub.org/repo/flathub.flatpakrepo
flatpak install --user --assumeyes flathub \
    org.freedesktop.Platform//25.08 \
    org.freedesktop.Sdk//25.08 \
    org.freedesktop.Sdk.Extension.rust-stable//25.08 \
    org.freedesktop.Sdk.Extension.llvm21//25.08
"""

[tasks."flatpak:build"]
description = "Build the flatpak into packaging/flatpak/repo and lay out the site"
depends = ["flatpak:sources", "licenses"]
run = "packaging/flatpak/publish.sh"

[tasks."flatpak:install"]
description = "Install the flatpak just built, replacing any installed one"
run = """
flatpak build-bundle packaging/flatpak/repo packaging/flatpak/MelkkiPDF.flatpak \
    io.github.xremming.MelkkiPDF stable
flatpak install --user --assumeyes --reinstall --bundle packaging/flatpak/MelkkiPDF.flatpak
"""

[tasks."flatpak:check"]
description = "Check the installed flatpak runs and its metadata validates"
run = "packaging/flatpak/check.sh"

# The release itself is the /release skill in .claude/skills, which bumps the
# version, writes the notes, commits, tags and pushes; this is its check.
[tasks."release:check"]
description = "Check that a release is ready to tag"
depends = ["flatpak:sources", "licenses"]
run = "packaging/common/release.sh check"
