id: io.github.xremming.MelkkiPDF
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  # mupdf-sys generates its bindings with bindgen, which needs libclang; the
  # base SDK does not ship one.
  - org.freedesktop.Sdk.Extension.llvm21
command: melkkipdf

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm21/bin
  env:
    # The vendored crates from cargo-sources.json are unpacked here.
    CARGO_HOME: /run/build/melkkipdf/cargo
    LIBCLANG_PATH: /usr/lib/sdk/llvm21/lib

finish-args:
  - --socket=wayland
  # The window still opens on Wayland when there is one, but the clipboard
  # goes through X11 there too: arboard, which both Slint and the viewer copy
  # through, reaches the Wayland clipboard only by the data-control protocol,
  # which GNOME lacks, and falls back to XWayland, so the X11 socket must be
  # there even with Wayland, not only in its place.
  - --socket=x11
  - --share=ipc
  # Slint renders through OpenGL, which needs the GPU device nodes.
  - --device=dri
  # PDFs opened from a file manager or the portal arrive through the document
  # portal, but a path passed on the command line, or a tab reopened from the
  # last session, does not. Reading the home directory and removable media
  # covers where documents live without exposing the rest of the system.
  - --filesystem=home:ro
  - --filesystem=/media:ro
  - --filesystem=/run/media:ro
  - --filesystem=/mnt:ro

modules:
  - name: melkkipdf
    buildsystem: simple
    build-options:
      env:
        # Everything must already be vendored; fail loudly rather than reaching
        # for the network, which is unavailable during the build anyway.
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo --offline build --release --bins --example quantize_model
      - install -Dm755 target/release/melkkipdf /app/bin/melkkipdf
      # The embedding model for searching by meaning, shrunk to int8 from
      # the half gigabyte downloaded, where the viewer looks for it beside
      # its binary.
      - target/release/examples/quantize_model model /app/share/melkkipdf/model
      - install -Dm644 packaging/flatpak/$FLATPAK_ID.desktop
        /app/share/applications/$FLATPAK_ID.desktop
      - install -Dm644 packaging/flatpak/$FLATPAK_ID.metainfo.xml
        /app/share/metainfo/$FLATPAK_ID.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/$FLATPAK_ID.svg
        /app/share/icons/hicolor/scalable/apps/$FLATPAK_ID.svg
      - install -Dm644 LICENSE /app/share/licenses/$FLATPAK_ID/LICENSE
      # Everything built into the viewer that is not its own, whose licences
      # ask for their notices to travel with the binary.
      - install -Dm644 packaging/common/third-party-licenses.txt
        /app/share/licenses/$FLATPAK_ID/third-party-licenses.txt
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - target
          - packaging/flatpak/build-dir
          - packaging/flatpak/repo
          - packaging/flatpak/site
          # A developer's download of the model, half a gigabyte that the
          # build fetches for itself.
          - data/model
      - cargo-sources.json
      # The embedding model, at the revision packaging/common/fetch-model.sh pins,
      # fetched like the crates before the build starts without a network.
      - type: file
        url: https://huggingface.co/minishlab/potion-multilingual-128M/resolve/73908c3438cf03b6a01bcb9611d62b23d0726f08/config.json
        sha256: 595e4cab2093732efd5dbe084fd5c1826b5eea693b73b4c1fd971672867d2e54
        dest: model
      - type: file
        url: https://huggingface.co/minishlab/potion-multilingual-128M/resolve/73908c3438cf03b6a01bcb9611d62b23d0726f08/tokenizer.json
        sha256: 19f1909063da3cfe3bd83a782381f040dccea475f4816de11116444a73e1b6a1
        dest: model
      - type: file
        url: https://huggingface.co/minishlab/potion-multilingual-128M/resolve/73908c3438cf03b6a01bcb9611d62b23d0726f08/model.safetensors
        sha256: 14b5eb39cb4ce5666da8ad1f3dc6be4346e9b2d601c073302fa0a31bf7943397
        dest: model
