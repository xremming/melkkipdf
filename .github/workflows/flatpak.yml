name: Flatpak

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A Pages deployment replaces the whole site, so never run two at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://xremming.github.io/melkkipdf
      GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
      GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user \
            flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      # Keeps the downloaded crate tarballs between runs; there are several
      # hundred of them.
      - name: Restore the flatpak-builder cache
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('packaging/cargo-sources.json') }}
          restore-keys: flatpak-builder-

      - name: Install the runtime and SDK
        run: |
          flatpak install --user --assumeyes flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 \
            org.freedesktop.Sdk.Extension.llvm21//25.08

      - name: Import the signing key
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir --mode=700 --parents "$GNUPGHOME"
          printenv GPG_PRIVATE_KEY | gpg --batch --import
          echo "GPG_HOMEDIR=$GNUPGHOME" >> "$GITHUB_ENV"

      # Warnings here (a missing screenshot, say) are worth seeing but are not
      # worth failing a release over, so only report them.
      - name: Validate the desktop metadata
        run: |
          sudo apt-get install --yes appstream desktop-file-utils
          desktop-file-validate packaging/io.github.xremming.MelkkiPDF.desktop
          appstreamcli validate --no-net \
            packaging/io.github.xremming.MelkkiPDF.metainfo.xml \
            || echo "::warning::appstreamcli reported metadata issues"

      - name: Build and lay out the site
        run: bash packaging/publish.sh

      - name: Check that the built app installs
        run: |
          flatpak build-bundle packaging/repo \
            packaging/MelkkiPDF.flatpak io.github.xremming.MelkkiPDF stable
          flatpak install --user --assumeyes --bundle packaging/MelkkiPDF.flatpak

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: packaging/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
