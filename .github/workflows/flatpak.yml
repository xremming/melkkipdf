name: Flatpak

# Only releases run here. CI builds the flatpak on every push, so there is no
# reason to build it a second time for a branch or a pull request.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# A Pages deployment replaces the whole site, so never run two at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://xremming.github.io/melkkipdf
      GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
      GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder appstream desktop-file-utils

      # Keeps the downloaded crate tarballs and the embedding model between
      # runs; there are several hundred of the former, and the latter is half
      # a gigabyte.
      - name: Restore the flatpak-builder cache
        uses: actions/cache@v6
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('packaging/cargo-sources.json', 'packaging/io.github.xremming.MelkkiPDF.yml') }}
          restore-keys: flatpak-builder-

      - run: mise run flatpak:runtime

      - name: Import the signing key
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir --mode=700 --parents "$GNUPGHOME"
          printenv GPG_PRIVATE_KEY | gpg --batch --import
          echo "GPG_HOMEDIR=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Build and lay out the site
        run: mise run flatpak:build

      # Installs what was built and checks it runs and its metadata validates,
      # as CI does on every push; a release should not get less.
      - run: mise run flatpak:install
      - run: mise run flatpak:check

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: packaging/site

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
