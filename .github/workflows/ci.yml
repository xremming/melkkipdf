name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the running checks irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# The tools and the commands come from mise.toml, so each job installs the
# pinned tools and runs the same task a laptop would.
jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run fmt:check

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run lint:shell

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5

      # mupdf-sys generates its bindings with bindgen, which needs libclang,
      # and the viewer links fontconfig for font discovery.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev libfontconfig1-dev

      # Keeps the compiled dependencies between runs, MuPDF above all, keyed
      # on the toolchain, the lock file and the job. Only what dependencies
      # produced is kept, so the crate's own rebuild stays cheap to store.
      - name: Restore the cargo cache
        uses: Swatinem/rust-cache@v2

      - run: mise run clippy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang libclang-dev libfontconfig1-dev

      # Keeps the compiled dependencies between runs, MuPDF above all, keyed
      # on the toolchain, the lock file and the job. Only what dependencies
      # produced is kept, so the crate's own rebuild stays cheap to store.
      - name: Restore the cargo cache
        uses: Swatinem/rust-cache@v2

      # The integration tests drive the real layout through
      # i-slint-backend-testing, so they need no display.
      - run: mise run test

  # Independent of the Rust checks: proves the manifest still builds and that
  # what it produces is a usable app, without publishing anything.
  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder appstream desktop-file-utils

      - name: Restore the flatpak-builder cache
        uses: actions/cache@v6
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ hashFiles('packaging/cargo-sources.json') }}
          restore-keys: flatpak-builder-

      - run: mise run flatpak:runtime

      # The same script a release runs, so the publish path itself is covered.
      # No signing key in the environment, so the repo comes out unsigned.
      - run: mise run flatpak:build

      - run: mise run flatpak:install

      - run: mise run flatpak:check
