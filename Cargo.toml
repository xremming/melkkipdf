[package]
name = "melkkipdf"
version = "0.1.1"
edition = "2024"
description = "A fast, minimal PDF viewer for Linux, inspired by SumatraPDF."
license = "AGPL-3.0-or-later"

[features]
# Exposes the headless `testing::Harness` used by the integration tests.
# Enable with `cargo test --features testing`.
testing = []

[dependencies]
slint = "1.17"
mupdf = "0.8"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSNotification",
    "NSString",
    "NSURL",
] }

[build-dependencies]
slint-build = "1.17"

# MuPDF is heavy to compile; optimize it even in debug builds so rendering
# is usable while iterating on the viewer itself.
[profile.dev.package.mupdf-sys]
opt-level = 3

[dev-dependencies]
i-slint-backend-testing = "1.17"
