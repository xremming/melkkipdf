[package]
name = "melkkipdf"
version = "0.11.2"
edition = "2024"
description = "A fast, minimal PDF viewer, inspired by SumatraPDF."
license = "AGPL-3.0-or-later"

[features]
# Exposes the headless `testing::Harness` used by the integration tests,
# running on Slint's testing backend so no display is needed. Enable with
# `cargo test --features testing`.
testing = ["dep:i-slint-backend-testing"]

[dependencies]
slint = { version = "1.18", features = ["unstable-winit-030"] }
mupdf = "0.8"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
icu_casemap = "2.3"
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_properties = "2.3"
# Slint gives the clipboard only to its own text fields, so copying goes
# through arboard directly, which Slint's winit backend links anyway. The
# image data feature is what puts a screenshot on the clipboard.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
# Static embeddings for searching by meaning. The model is read from disk
# only, as the flatpak has no network, and the tokenizer's regexes go through
# fancy-regex rather than oniguruma, so the build stays pure Rust.
model2vec-rs = { version = "0.3", default-features = false, features = ["local-only"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
i-slint-backend-testing = { version = "1.18", optional = true }

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
# The same protocol Slint's backend uses on Wayland; without it arboard
# falls back to the X11 clipboard through XWayland, as Slint does.
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSAppleEventDescriptor",
    "NSAppleEventManager",
    "NSNotification",
    "NSString",
    "NSURL",
] }

[build-dependencies]
slint-build = "1.18"

# MuPDF is heavy to compile; optimize it even in debug builds so rendering
# is usable while iterating on the viewer itself.
[profile.dev.package.mupdf-sys]
opt-level = 3

[dev-dependencies]
i-slint-backend-testing = "1.18"
# The quantize_model example, which the flatpak and the macOS bundle run on
# the embedding model they ship. The version model2vec-rs reads with.
safetensors = "0.5"
